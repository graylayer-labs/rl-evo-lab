[project]
name = "rl-evo-lab"
version = "0.1.0"
description = "Evolutionary Reinforcement Learning: reproduction and extension of EDER"
authors = [
    {name = "eoinmcallister", email = "eoinmc.james@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.3",
    "numpy>=1.26",
    "gymnasium[box2d]>=1.2.3,<2.0.0",
    "wandb (>=0.25.1,<0.26.0)",
    "matplotlib (>=3.10.8,<4.0.0)",
    "pandas (>=3.0.1,<4.0.0)",
    "rich (>=14.3.3,<15.0.0)",
    "pygame>=2.6.1",
]

[project.optional-dependencies]
mujoco = ["gymnasium[mujoco]>=1.0"]
viz = ["imageio>=2.29"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/actor",
    "src/buffer",
    "src/envs",
    "src/infra",
    "src/intrinsic",
    "src/learner",
    "src/runner",
]

[tool.ty.environment]
python-version = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short"

[dependency-groups]
dev = [
    "pygame>=2.6.1",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.15.8",
    "ty>=0.0.26",
]
